[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-guard-bench"
version = "0.1.0"
description = "Adversarial benchmark for evaluating LLM robustness against jailbreaks and prompt injection."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Md Eaftekhirul Islam" }]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "aiosqlite>=0.17.0",
    "groq>=0.4.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
llm-guard-bench = "llm_guard_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_guard_bench = ["resources/*.json", "storage/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes: unused imports, undefined names
    "I",      # import sorting
    "B",      # flake8-bugbear: likely bugs
    "UP",     # pyupgrade: modern Python syntax
    "ASYNC",  # async pitfalls such as blocking calls in coroutines
]